    <rect x="645" y="165" width="8" height="28"/><rect x="635" y="175" width="28" height="8"/>
    <path d="M767 116h28v8h-28zM777 106h8v28h-8z"/>
  </g>
  <text x="653" y="386" text-anchor="middle" fill="#8effa2" font-family="monospace" font-size="16">IDEAS → CODE → ADVENTURE</text>
</svg>
